pointcloud_to_laserscan_node:
  ros__parameters:
    target_frame: "base_link"
    transform_tolerance: 0.01
    min_height: -0.1          # 根据雷达安装高度调整（仿真中车体较小）
    max_height: 0.5
    angle_min: -3.14159       # -180°
    angle_max: 3.14159        # +180°
    angle_increment: 0.00436  # 约 0.25°，约1440点/圈
    scan_time: 0.1            # 对应 10Hz
    range_min: 0.15
    range_max: 40.0
    use_inf: true
    inf_epsilon: 1.0